name: workmanager
description: Flutter Workmanager. This plugin allows you to schedule background work on Android and iOS.
version: 0.10.6
# publish_to: none
homepage: https://github.com/fluttercommunity/flutter_workmanager
repository: https://github.com/fluttercommunity/flutter_workmanager
issue_tracker: https://github.com/fluttercommunity/flutter_workmanager/issues

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  workmanager_platform_interface: ^0.10.4
  workmanager_android: ^0.10.5
  workmanager_apple: ^0.9.10
  workmanager_web: ^0.1.3+1
  workmanager_linux: ^0.1.1

dev_dependencies:
  test: ^1.25.15
  mockito: ^5.4.4
  build_runner: ^2.4.9
  get_it: ^8.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: workmanager_android
      ios:
        default_package: workmanager_apple
      macos:
        default_package: workmanager_apple
      web:
        default_package: workmanager_web

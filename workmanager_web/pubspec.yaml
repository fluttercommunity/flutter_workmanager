name: workmanager_web
description: Web (experimental) implementation of workmanager using a Service Worker and Web Worker for background task execution.
version: 0.1.1
# publish_to: none
homepage: https://github.com/fluttercommunity/flutter_workmanager
repository: https://github.com/fluttercommunity/flutter_workmanager
issue_tracker: https://github.com/fluttercommunity/flutter_workmanager/issues

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  workmanager_platform_interface: ^0.10.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: workmanager
    platforms:
      web:
        pluginClass: WorkmanagerWeb
        fileName: workmanager_web.dart

name: workmanager_windows
description: Windows implementation of the workmanager plugin using the Task Scheduler (schtasks).
version: 0.0.1
# publish_to: none
homepage: https://github.com/fluttercommunity/flutter_workmanager
repository: https://github.com/fluttercommunity/flutter_workmanager
issue_tracker: https://github.com/fluttercommunity/flutter_workmanager/issues

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  workmanager_platform_interface: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.15

flutter:
  plugin:
    implements: workmanager
    platforms:
      windows:
        dartPluginClass: WorkmanagerWindows

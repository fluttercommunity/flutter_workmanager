name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-changes
        id: filter

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Test
        run: |
          cd workmanager
          flutter test

  native_ios_tests:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Setup iOS build environment
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-version
      - name: Clean and prepare Flutter
        run: |
          cd example
          flutter clean
          flutter pub get
      - name: Build iOS App
        run: cd example && flutter build ios --debug --no-codesign --verbose
      - name: Resolve latest iOS simulator
        id: sim
        uses: ./.github/actions/resolve-ios-simulator
      - name: Run native iOS tests
        run: cd example/ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner -sdk iphonesimulator -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" test

  native_android_tests:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Support envelope: the minimum Flutter the plugin claims (>=3.38) and
        # the currently pinned version (see .fvmrc). Kept in parallel so one
        # Flutter version failing doesn't mask the other.
        flutter-version: ['3.38.9', '3.44.8']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Build Android App
        run: cd example && flutter build apk --debug
      - name: Run native Android tests
        run: cd example/android && ./gradlew :workmanager_android:test

  # AGP 9 removed `android.kotlinOptions` and KGP-based Kotlin compilation for
  # library modules; the plugin must compile via AGP's built-in Kotlin (see
  # #710). This job builds a scratch app from the Flutter 3.44 template wired
  # to the local plugin, bumped to the latest stable AGP 9.2.1 (the reporter's
  # #710 combo) with `android.builtInKotlin=true` (the Flutter-template default
  # `false` disables the only Kotlin path AGP 9 has for library modules).
  #
  # The scratch app is used instead of the example because the example's graph
  # contains the Flutter SDK's own integration_test, which still applies KGP
  # (unmigrated in 3.44.8) and hard-errors under AGP 9 + built-in Kotlin — an
  # SDK migration issue outside this plugin's control.
  android_agp9_build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
          cache: true
      - name: Build scratch app with AGP 9 + built-in Kotlin
        run: |
          set -e
          flutter create --platforms=android --project-name wm_agp9_test /tmp/wm_agp9_test >/dev/null
          python3 - <<'EOF'
          import re

          root = '${{ github.workspace }}'

          # Point the scratch app at the local plugin packages.
          p = '/tmp/wm_agp9_test/pubspec.yaml'
          s = open(p).read()
          s = s.replace(
              '  cupertino_icons: ^1.0.8',
              '  cupertino_icons: ^1.0.8\n  workmanager:\n    path: %s/workmanager' % root)
          s += '\n' + '\n'.join([
              'dependency_overrides:',
              '  workmanager_android:',
              '    path: %s/workmanager_android' % root,
              '  workmanager_apple:',
              '    path: %s/workmanager_apple' % root,
              '  workmanager_platform_interface:',
              '    path: %s/workmanager_platform_interface' % root,
              '  workmanager_web:',
              '    path: %s/workmanager_web' % root,
          ]) + '\n'
          open(p, 'w').write(s)

          # Flutter 3.44 templates default to android.builtInKotlin=false; the
          # plugin needs the built-in mode on AGP 9 (see #710).
          p = '/tmp/wm_agp9_test/android/gradle.properties'
          s = open(p).read()
          s = s.replace('android.builtInKotlin=false', 'android.builtInKotlin=true')
          open(p, 'w').write(s)

          # Bump to the latest stable AGP 9.2.1 (the #710 reporter's version);
          # the template ships 9.0.1/Gradle 9.1.0. AGP 9 requires Gradle 9.x.
          p = '/tmp/wm_agp9_test/android/settings.gradle.kts'
          s = open(p).read()
          s = s.replace(
              'id("com.android.application") version "9.0.1" apply false',
              'id("com.android.application") version "9.2.1" apply false')
          open(p, 'w').write(s)

          p = '/tmp/wm_agp9_test/android/gradle/wrapper/gradle-wrapper.properties'
          s = open(p).read()
          s = s.replace('gradle-9.1.0-all.zip', 'gradle-9.5.1-all.zip')
          open(p, 'w').write(s)
          EOF
          cd /tmp/wm_agp9_test && flutter build apk --debug

  drive_ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Resolve latest iOS simulator
        id: sim
        uses: ./.github/actions/resolve-ios-simulator
      - uses: futureware-tech/simulator-action@v3
        with:
          model: '${{ steps.sim.outputs.model }}'
      - uses: bluefireteam/melos-action@v3
      # Run flutter integrate tests
      - name: Run Flutter integration tests
        timeout-minutes: 35
        run: |
          # `flutter test` on iOS simulators intermittently stalls before the
          # Dart VM service becomes available (flutter/flutter#153433). Retry a
          # few times with a per-attempt timeout; cached builds make retries fast.
          cd example
          for attempt in 1 2 3; do
            echo "=== drive_ios attempt $attempt ==="
            if perl -e 'alarm shift; exec @ARGV' 480 flutter test integration_test/workmanager_integration_test.dart -d "${{ steps.sim.outputs.udid }}" > /tmp/flutter_test_$attempt.log 2>&1; then
              echo "drive_ios passed on attempt $attempt"
              exit 0
            fi
            echo "drive_ios attempt $attempt failed (exit $?)"
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" dev.fluttercommunity.workmanagerExample 2>/dev/null || true
          done
          echo "All attempts failed; dumping last attempt log:"
          tail -100 /tmp/flutter_test_3.log
          exit 1
      - name: Dump simulator logs
        if: failure()
        run: |
          echo "=== Last 100 lines of flutter test log ==="
          tail -100 /tmp/flutter_test_3.log || true
          echo "=== Runner app logs (last 10m) ==="
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 10m --predicate 'process == "Runner"' --style compact 2>/dev/null | tail -80 || true


  drive_android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    #creates a build matrix for your jobs
    strategy:
      #set of different configurations of the virtual environment.
      matrix:
        api-level: [35]
        # api-level: [21, 29]
        target: [default]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@v3
      
      # Gradle cache for better performance
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
      
      # AVD cache to speed up emulator startup
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ runner.os }}
      
      # Generate AVD snapshot for caching if not already cached
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot"
      
      # Run actual tests using cached AVD
      - name: Run Flutter integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: |
            cd example && flutter test integration_test/workmanager_integration_test.dart

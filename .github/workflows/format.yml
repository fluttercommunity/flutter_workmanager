name: format + publishable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format_dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          fvm: true
      - name: Format
        run: |
          flutter pub get
          # Format specific files, excluding generated .g.dart files
          find . -name "*.dart" ! -name "*.g.dart" ! -path "*/.*" -print0 | xargs -0 dart format --set-exit-if-changed

  format_kotlin:
    runs-on: ubuntu-latest

    steps:
      - name: "checkout"
        uses: actions/checkout@v7

      - name: ktlint
        uses: ScaCap/action-ktlint@v1.9.0
        with:
          github_token: ${{ secrets.github_token }}
          ktlint_version: "1.7.1"

  format_swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Action for SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1

  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          fvm: true

      - uses: bluefireteam/melos-action@v3
      - name: publish checks
        run: |
          cd workmanager_platform_interface
          flutter pub publish -n
          cd ../workmanager_android
          flutter pub publish -n
          cd ../workmanager_apple
          flutter pub publish -n
          cd ../workmanager
          flutter pub publish -n

group 'dev.fluttercommunity.workmanager'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin support; older versions need the Kotlin Gradle
// Plugin (KGP) applied explicitly. Do NOT apply KGP on AGP 9+: it is a no-op
// there for library modules (and deprecated), so Kotlin sources only compile
// via AGP's built-in Kotlin (see flutter/flutter#183910 and #710). Apps that
// still set `android.builtInKotlin=false` on AGP 9 must migrate to built-in
// Kotlin — with that flag no Kotlin plugin compiles at all.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.fluttercommunity.workmanager'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    defaultConfig {
        compileSdk 35
        minSdkVersion 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (agpMajor < 9) {
        kotlinOptions {
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = "1.8"
            }
        }
    }
}

// AGP 9: `kotlinOptions` inside `android {}` was removed. Configure the Kotlin
// compiler via the `kotlin` extension (provided by built-in Kotlin, or by KGP
// 2.0+ on the legacy path). Kept in sync with compileOptions above.
if (agpMajor >= 9) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

dependencies {
    def work_version = "2.11.2"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.mockito:mockito-core:4.11.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"
    // Synchronous WorkManager driver for Robolectric chain tests.
    testImplementation "androidx.work:work-testing:$work_version"
    // WorkDatabase (used to inspect enqueued chains) extends RoomDatabase.
    testImplementation 'androidx.room:room-runtime:2.7.0'
    // ApplicationProvider for Robolectric tests.
    testImplementation 'androidx.test:core:1.5.0'
    // Real org.json implementation for JVM unit tests (android.jar only stubs it).
    testImplementation 'org.json:json:20240303'
    // Real Android framework implementations (Build, Uri, ...) for JVM unit tests.
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
